<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-car-front-fill me-2"></i>Sistema de Gestão de Veículos</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div id="alerta" class="alert d-none shadow-sm" role="alert"></div>

        <div class="row g-4 mb-4">
            <!-- Cadastro Rápido de Marca e Modelo -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold"><i class="bi bi-tags me-1"></i> 1. Marca & Modelo</div>
                    <div class="card-body">
                        <form id="formMarca" class="mb-3">
                            <label class="form-label small fw-semibold">Nova Marca</label>
                            <div class="input-group">
                                <input type="text" id="marcaNome" class="form-control" placeholder="Ex: Ford, Fiat" required>
                                <button class="btn btn-primary" type="submit">Salvar</button>
                            </div>
                        </form>
                        <hr>
                        <form id="formModelo">
                            <label class="form-label small fw-semibold">Novo Modelo</label>
                            <select id="selectMarcaParaModelo" class="form-select mb-2" required>
                                <option value="">Selecione a Marca...</option>
                            </select>
                            <div class="input-group">
                                <input type="text" id="modeloNome" class="form-control" placeholder="Ex: Ka, Palio" required>
                                <button class="btn btn-primary" type="submit">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cadastro de Veículo -->
            <div class="col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold"><i class="bi bi-plus-circle me-1"></i> 2. Cadastrar Veículo no Estoque</div>
                    <div class="card-body">
                        <form id="formVeiculo" class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Modelo</label>
                                <select id="selectModeloParaVeiculo" class="form-select" required>
                                    <option value="">Selecione o Modelo...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Placa</label>
                                <input type="text" id="placa" class="form-control" placeholder="Ex: ABC1234" maxlength="7" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Cor</label>
                                <input type="text" id="cor" class="form-control" placeholder="Ex: Prata" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Ano Fab.</label>
                                <input type="number" id="anoFabricacao" class="form-control" placeholder="2020" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Ano Mod.</label>
                                <input type="number" id="anoModelo" class="form-control" placeholder="2021" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Preço (R$)</label>
                                <input type="number" step="0.01" id="preco" class="form-control" placeholder="35000.00" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Km</label>
                                <input type="number" id="quilometragem" class="form-control" placeholder="45000" required>
                            </div>
                            <div class="col-12 text-end mt-3">
                                <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-circle me-1"></i>Cadastrar Veículo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Veículos em Estoque -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span class="fw-bold"><i class="bi bi-grid-3x3-gap me-1"></i> Veículos em Estoque</span>
                <div class="d-flex gap-2">
                    <input type="text" id="filtroPlaca" class="form-control form-control-sm" placeholder="Buscar por placa...">
                    <button class="btn btn-sm btn-outline-secondary" onclick="carregarVeiculos()"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Marca / Modelo</th>
                                <th>Ano Fab/Mod</th>
                                <th>Cor</th>
                                <th>Km</th>
                                <th>Preço</th>
                                <th>Status</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaVeiculos">
                            <tr>
                                <td colspan="9" class="text-center py-4 text-muted">Carregando dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api";

        function exibirAlerta(mensagem, tipo = 'success') {
            const alerta = document.getElementById("alerta");
            alerta.className = `alert alert-${tipo} shadow-sm`;
            alerta.innerText = mensagem;
            alerta.classList.remove("d-none");
            setTimeout(() => alerta.classList.add("d-none"), 4000);
        }

        async function carregarMarcas() {
            try {
                const res = await fetch(`${API_BASE}/marcas`);
                const marcas = await res.json();
                const select = document.getElementById("selectMarcaParaModelo");
                select.innerHTML = '<option value="">Selecione a Marca...</option>';
                marcas.forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.nome}</option>`;
                });
            } catch (err) {
                console.error("Erro ao carregar marcas", err);
            }
        }

        async function carregarModelos() {
            try {
                const res = await fetch(`${API_BASE}/modelos`);
                const modelos = await res.json();
                const select = document.getElementById("selectModeloParaVeiculo");
                select.innerHTML = '<option value="">Selecione o Modelo...</option>';
                modelos.forEach(m => {
                    const nomeMarca = m.marca ? m.marca.nome : 'Sem Marca';
                    select.innerHTML += `<option value="${m.id}">${m.nome} (${nomeMarca})</option>`;
                });
            } catch (err) {
                console.error("Erro ao carregar modelos", err);
            }
        }

        async function carregarVeiculos() {
            try {
                const res = await fetch(`${API_BASE}/veiculos`);
                const veiculos = await res.json();
                const tbody = document.getElementById("tabelaVeiculos");
                tbody.innerHTML = "";

                if (veiculos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">Nenhum veículo cadastrado.</td></tr>';
                    return;
                }

                veiculos.forEach(v => {
                    const nomeModelo = v.modelo ? v.modelo.nome : '-';
                    const nomeMarca = v.modelo && v.modelo.marca ? v.modelo.marca.nome : '-';
                    
                    let badgeClass = "bg-success";
                    if (v.status === "VENDIDO") badgeClass = "bg-secondary";
                    if (v.status === "EM_MANUTENCAO") badgeClass = "bg-warning text-dark";

                    tbody.innerHTML += `
                        <tr>
                            <td>${v.id}</td>
                            <td class="fw-bold">${v.placa}</td>
                            <td>${nomeMarca} ${nomeModelo}</td>
                            <td>${v.anoFabricacao}/${v.anoModelo}</td>
                            <td>${v.cor}</td>
                            <td>${Number(v.quilometragem).toLocaleString('pt-BR')} km</td>
                            <td>R$ ${Number(v.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                            <td><span class="badge ${badgeClass}">${v.status}</span></td>
                            <td class="text-center">
                                ${v.status === 'DISPONIVEL' ? 
                                    `<button class="btn btn-sm btn-outline-success me-1" onclick="atualizarStatus(${v.id}, 'VENDIDO')" title="Marcar como Vendido"><i class="bi bi-cart-check"></i></button>` : 
                                    `<button class="btn btn-sm btn-outline-primary me-1" onclick="atualizarStatus(${v.id}, 'DISPONIVEL')" title="Marcar como Disponível"><i class="bi bi-arrow-counterclockwise"></i></button>`
                                }
                                <button class="btn btn-sm btn-outline-danger" onclick="deletarVeiculo(${v.id})" title="Remover"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Erro ao carregar veículos", err);
            }
        }

        document.getElementById("formMarca").addEventListener("submit", async (e) => {
            e.preventDefault();
            const nome = document.getElementById("marcaNome").value;
            const res = await fetch(`${API_BASE}/marcas`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome })
            });

            if (res.ok) {
                exibirAlerta("Marca cadastrada com sucesso!");
                document.getElementById("marcaNome").value = "";
                carregarMarcas();
            } else {
                const erro = await res.json();
                exibirAlerta(erro.mensagem || "Erro ao salvar marca.", "danger");
            }
        });

        document.getElementById("formModelo").addEventListener("submit", async (e) => {
            e.preventDefault();
            const marcaId = document.getElementById("selectMarcaParaModelo").value;
            const nome = document.getElementById("modeloNome").value;

            const res = await fetch(`${API_BASE}/modelos/marca/${marcaId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome })
            });

            if (res.ok) {
                exibirAlerta("Modelo cadastrado com sucesso!");
                document.getElementById("modeloNome").value = "";
                carregarModelos();
            } else {
                const erro = await res.json();
                exibirAlerta(erro.mensagem || "Erro ao salvar modelo.", "danger");
            }
        });

        document.getElementById("formVeiculo").addEventListener("submit", async (e) => {
            e.preventDefault();
            const modeloId = document.getElementById("selectModeloParaVeiculo").value;
            const payload = {
                placa: document.getElementById("placa").value,
                cor: document.getElementById("cor").value,
                anoFabricacao: parseInt(document.getElementById("anoFabricacao").value),
                anoModelo: parseInt(document.getElementById("anoModelo").value),
                preco: parseFloat(document.getElementById("preco").value),
                quilometragem: parseInt(document.getElementById("quilometragem").value),
                status: "DISPONIVEL"
            };

            const res = await fetch(`${API_BASE}/veiculos/modelo/${modeloId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                exibirAlerta("Veículo adicionado ao estoque!");
                document.getElementById("formVeiculo").reset();
                carregarVeiculos();
            } else {
                const erro = await res.json();
                exibirAlerta(erro.mensagem || "Erro ao cadastrar veículo.", "danger");
            }
        });

        async function atualizarStatus(id, novoStatus) {
            const res = await fetch(`${API_BASE}/veiculos/${id}/status?status=${novoStatus}`, {
                method: "PATCH"
            });
            if (res.ok) {
                exibirAlerta(`Status atualizado para ${novoStatus}!`);
                carregarVeiculos();
            }
        }

        async function deletarVeiculo(id) {
            if (!confirm("Deseja realmente remover este veículo?")) return;
            const res = await fetch(`${API_BASE}/veiculos/${id}`, {
                method: "DELETE"
            });
            if (res.ok) {
                exibirAlerta("Veículo removido com sucesso!");
                carregarVeiculos();
            }
        }

        document.getElementById("filtroPlaca").addEventListener("input", function() {
            const busca = this.value.toUpperCase();
            const linhas = document.querySelectorAll("#tabelaVeiculos tr");
            linhas.forEach(linha => {
                const placa = linha.children[1]?.innerText.toUpperCase() || "";
                linha.style.display = placa.includes(busca) ? "" : "none";
            });
        });

        // Inicialização
        carregarMarcas();
        carregarModelos();
        carregarVeiculos();
    </script>
</body>
</html>
